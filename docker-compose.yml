# Local copy of the Practice Software Testing "Toolshop", built from its published images.
# Start it with scripts/start.sh, which also loads the demo data and waits until it is ready.
#
# UI: http://localhost:4200   API: http://localhost:8091
name: toolshop

x-api-env: &api-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  DISABLE_LOGGING: "true"

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment: *api-env
    volumes:
      - api-code:/var/www
    depends_on:
      - mariadb

  # nginx in front of PHP-FPM; serves the API code from the shared volume.
  web:
    image: testsmith/practice-software-testing-web:latest
    ports:
      - "8091:80"
    volumes:
      - api-code:/var/www
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - "4200:4200"
    environment:
      NG_CLI_ANALYTICS: "false"
    command: ng serve --host 0.0.0.0 --port 4200

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  api-code:
