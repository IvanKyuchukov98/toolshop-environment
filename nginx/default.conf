# Serves the Laravel API through PHP-FPM, the same as the Toolshop's own web image.
server {
    listen 80;
    index index.php index.html;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    # Server-sent events: no buffering, so events reach the browser as they are written.
    location = /sales-stream {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
